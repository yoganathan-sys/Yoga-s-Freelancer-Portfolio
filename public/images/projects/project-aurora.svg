<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="au-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#au-bg)"/>
  
  <g transform="translate(100, 80)">
    <rect width="1000" height="640" rx="16" fill="#18181b" stroke="#7c3aed" stroke-width="2"/>
    <text x="50" y="60" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Aurora UI Design System & Component Spec</text>
    <text x="50" y="85" fill="#c4b5fd" font-family="sans-serif" font-size="14">64 Production Components • WCAG 2.1 AA Compliant</text>

    <!-- Component Row 1: Buttons -->
    <g transform="translate(50, 120)">
      <text x="0" y="0" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold">BUTTON STATES</text>
      <rect x="0" y="15" width="140" height="44" rx="8" fill="#8b5cf6"/>
      <text x="40" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Primary</text>

      <rect x="160" y="15" width="140" height="44" rx="8" fill="#3f3f46"/>
      <text x="195" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Secondary</text>

      <rect x="320" y="15" width="140" height="44" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="365" y="42" fill="#c4b5fd" font-family="sans-serif" font-size="14" font-weight="bold">Outline</text>

      <rect x="480" y="15" width="140" height="44" rx="8" fill="#ef4444"/>
      <text x="515" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Destructive</text>
    </g>

    <!-- Component Row 2: Badges & Tags -->
    <g transform="translate(50, 220)">
      <text x="0" y="0" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold">STATUS PILLS & TOKENS</text>
      <rect x="0" y="15" width="90" height="26" rx="13" fill="#10b981" opacity="0.2"/>
      <text x="18" y="32" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Active</text>

      <rect x="105" y="15" width="90" height="26" rx="13" fill="#f59e0b" opacity="0.2"/>
      <text x="120" y="32" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">Pending</text>

      <rect x="210" y="15" width="100" height="26" rx="13" fill="#ef4444" opacity="0.2"/>
      <text x="225" y="32" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">Archived</text>
    </g>

    <!-- Component Row 3: Modal Dialog Preview -->
    <g transform="translate(50, 310)">
      <rect width="420" height="260" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#8b5cf6"/>
      <text x="60" y="35" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Confirm Deployment</text>
      <text x="30" y="80" fill="#a1a1aa" font-family="sans-serif" font-size="13">You are about to release version 2.4 to edge clusters.</text>
      <rect x="30" y="110" width="360" height="42" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="45" y="136" fill="#71717a" font-family="sans-serif" font-size="12">Type RELEASE to confirm</text>
      <rect x="270" y="190" width="120" height="40" rx="8" fill="#8b5cf6"/>
      <text x="305" y="215" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Proceed</text>
    </g>

    <!-- Component Row 4: Color Swatches -->
    <g transform="translate(520, 310)">
      <rect width="430" height="260" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="30" y="35" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Design Token Swatches</text>
      
      <circle cx="60" cy="80" r="22" fill="#8b5cf6"/>
      <text x="100" y="85" fill="#ffffff" font-family="sans-serif" font-size="13">Primary / #8B5CF6</text>

      <circle cx="60" cy="135" r="22" fill="#10b981"/>
      <text x="100" y="140" fill="#ffffff" font-family="sans-serif" font-size="13">Success / #10B981</text>

      <circle cx="60" cy="190" r="22" fill="#0f172a"/>
      <text x="100" y="195" fill="#ffffff" font-family="sans-serif" font-size="13">Surface / #0F172A</text>
    </g>
  </g>
</svg>

