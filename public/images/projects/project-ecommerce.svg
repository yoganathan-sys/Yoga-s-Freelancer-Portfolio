<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="950" cy="200" r="280" fill="#6366f1" opacity="0.15" filter="blur(60px)"/>
  
  <!-- Browser Window Frame -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="600" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="2"/>
    <rect width="1000" height="50" rx="16" fill="#1e293b"/>
    <circle cx="35" cy="25" r="7" fill="#ef4444"/>
    <circle cx="55" cy="25" r="7" fill="#f59e0b"/>
    <circle cx="75" cy="25" r="7" fill="#10b981"/>
    <rect x="250" y="14" width="500" height="22" rx="11" fill="#0f172a"/>
    <text x="400" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">https://store.cloud/catalog</text>

    <!-- Content Mockup -->
    <!-- Sidebar -->
    <rect x="30" y="80" width="180" height="480" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="50" y="110" width="100" height="14" rx="4" fill="#6366f1"/>
    <rect x="50" y="140" width="140" height="10" rx="4" fill="#334155"/>
    <rect x="50" y="165" width="120" height="10" rx="4" fill="#334155"/>
    <rect x="50" y="190" width="130" height="10" rx="4" fill="#334155"/>
    <rect x="50" y="230" width="90" height="12" rx="4" fill="#94a3b8"/>
    <rect x="50" y="260" width="140" height="10" rx="4" fill="#334155"/>
    <rect x="50" y="285" width="110" height="10" rx="4" fill="#334155"/>

    <!-- Products Grid -->
    <!-- Card 1 -->
    <rect x="240" y="80" width="220" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="260" y="100" width="180" height="110" rx="8" fill="url(#accent)" opacity="0.4"/>
    <rect x="260" y="230" width="120" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="255" width="60" height="12" rx="4" fill="#10b981"/>
    <rect x="380" y="280" width="60" height="24" rx="6" fill="#6366f1"/>

    <!-- Card 2 -->
    <rect x="490" y="80" width="220" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="510" y="100" width="180" height="110" rx="8" fill="#3b82f6" opacity="0.4"/>
    <rect x="510" y="230" width="140" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="510" y="255" width="70" height="12" rx="4" fill="#10b981"/>
    <rect x="630" y="280" width="60" height="24" rx="6" fill="#6366f1"/>

    <!-- Card 3 -->
    <rect x="740" y="80" width="220" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="760" y="100" width="180" height="110" rx="8" fill="#10b981" opacity="0.3"/>
    <rect x="760" y="230" width="130" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="760" y="255" width="55" height="12" rx="4" fill="#10b981"/>
    <rect x="880" y="280" width="60" height="24" rx="6" fill="#6366f1"/>

    <!-- Stats Banner -->
    <rect x="240" y="350" width="720" height="210" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="270" y="390" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">Enterprise Checkout Telemetry</text>
    <path d="M 270 510 C 350 490 420 450 500 470 C 580 490 650 430 720 410 C 800 390 880 430 930 400" fill="none" stroke="#6366f1" stroke-width="4"/>
  </g>
</svg>

