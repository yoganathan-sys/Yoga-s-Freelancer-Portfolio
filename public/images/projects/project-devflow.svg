<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="kanban-col" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#df-bg)"/>
  
  <g transform="translate(100, 80)">
    <!-- App Container -->
    <rect width="1000" height="640" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Top Nav -->
    <rect width="1000" height="56" rx="14" fill="#27272a"/>
    <circle cx="35" cy="28" r="6" fill="#ef4444"/>
    <circle cx="55" cy="28" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="28" r="6" fill="#10b981"/>
    <text x="110" y="34" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">DevFlow — Sprint 42 Workspace</text>
    <rect x="840" y="16" width="130" height="26" rx="13" fill="#3b82f6"/>
    <text x="865" y="33" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">+ New Task</text>

    <!-- Column 1: Backlog -->
    <g transform="translate(40, 80)">
      <rect width="280" height="520" rx="10" fill="url(#kanban-col)" stroke="#3f3f46" stroke-width="1"/>
      <text x="20" y="35" fill="#a1a1aa" font-family="sans-serif" font-weight="bold" font-size="14">BACKLOG (4)</text>
      
      <!-- Card 1 -->
      <rect x="15" y="55" width="250" height="90" rx="8" fill="#18181b" stroke="#52525b" stroke-width="1"/>
      <rect x="25" y="70" width="60" height="16" rx="4" fill="#3b82f6" opacity="0.3"/>
      <text x="32" y="82" fill="#93c5fd" font-family="sans-serif" font-size="10">AUTH-401</text>
      <text x="25" y="105" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Configure OAuth 2.0 PKCE</text>
      <circle cx="240" cy="120" r="10" fill="#6366f1"/>

      <!-- Card 2 -->
      <rect x="15" y="160" width="250" height="90" rx="8" fill="#18181b" stroke="#52525b" stroke-width="1"/>
      <rect x="25" y="175" width="60" height="16" rx="4" fill="#ec4899" opacity="0.3"/>
      <text x="32" y="187" fill="#f472b6" font-family="sans-serif" font-size="10">DB-108</text>
      <text x="25" y="210" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Index Composite Keys</text>
      <circle cx="240" cy="225" r="10" fill="#10b981"/>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(360, 80)">
      <rect width="280" height="520" rx="10" fill="url(#kanban-col)" stroke="#3b82f6" stroke-width="2"/>
      <text x="20" y="35" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="14">IN PROGRESS (3)</text>
      
      <!-- Card 1 -->
      <rect x="15" y="55" width="250" height="110" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <rect x="25" y="70" width="60" height="16" rx="4" fill="#10b981" opacity="0.3"/>
      <text x="32" y="82" fill="#6ee7b7" font-family="sans-serif" font-size="10">API-204</text>
      <text x="25" y="105" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Real-time Webhook sync</text>
      <!-- Progress Bar -->
      <rect x="25" y="130" width="200" height="6" rx="3" fill="#3f3f46"/>
      <rect x="25" y="130" width="150" height="6" rx="3" fill="#10b981"/>
      <circle cx="240" cy="140" r="10" fill="#f59e0b"/>

      <!-- Card 2 -->
      <rect x="15" y="180" width="250" height="90" rx="8" fill="#18181b" stroke="#52525b" stroke-width="1"/>
      <text x="25" y="215" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold">Framer Motion transition</text>
    </g>

    <!-- Column 3: Completed -->
    <g transform="translate(680, 80)">
      <rect width="280" height="520" rx="10" fill="url(#kanban-col)" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="35" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">DEPLOYED (12)</text>

      <!-- Card 1 -->
      <rect x="15" y="55" width="250" height="90" rx="8" fill="#18181b" stroke="#059669" stroke-width="1"/>
      <text x="25" y="95" fill="#a1a1aa" font-family="sans-serif" font-size="13" text-decoration="line-through">Vercel Edge Functions</text>
      <circle cx="240" cy="120" r="10" fill="#10b981"/>
    </g>
  </g>
</svg>
