<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="hp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#hp-bg)"/>
  
  <!-- Left Phone Mockup -->
  <g transform="translate(250, 80)">
    <rect width="320" height="640" rx="44" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <rect x="15" y="15" width="290" height="610" rx="36" fill="url(#phone-screen)"/>
    <rect x="95" y="24" width="130" height="24" rx="12" fill="#0f172a"/>
    
    <!-- Phone Content -->
    <text x="35" y="85" fill="#a7f3d0" font-family="sans-serif" font-size="14">Good morning,</text>
    <text x="35" y="115" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">HealthPulse Vitals</text>

    <!-- Pulse Card -->
    <rect x="30" y="140" width="260" height="130" rx="18" fill="#047857" opacity="0.8"/>
    <text x="50" y="175" fill="#ecfdf5" font-family="sans-serif" font-size="14">Resting Heart Rate</text>
    <text x="50" y="215" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">72 BPM</text>
    <path d="M 50 240 L 90 240 L 110 220 L 130 255 L 150 210 L 170 240 L 260 240" fill="none" stroke="#6ee7b7" stroke-width="3"/>

    <!-- Doctor Appointment Card -->
    <rect x="30" y="290" width="260" height="150" rx="18" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="65" cy="335" r="22" fill="#34d399"/>
    <text x="100" y="330" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Dr. Amanda Lee</text>
    <text x="100" y="350" fill="#6ee7b7" font-family="sans-serif" font-size="12">Cardiologist (10:30 AM)</text>
    <rect x="50" y="380" width="220" height="40" rx="20" fill="#10b981"/>
    <text x="110" y="405" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Join Video Call</text>

    <!-- Quick Actions -->
    <rect x="30" y="460" width="120" height="110" rx="16" fill="#047857" opacity="0.6"/>
    <text x="50" y="525" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Prescriptions</text>
    
    <rect x="170" y="460" width="120" height="110" rx="16" fill="#047857" opacity="0.6"/>
    <text x="190" y="525" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Lab Results</text>
  </g>

  <!-- Right Phone Mockup (Overlap) -->
  <g transform="translate(630, 130)">
    <rect width="320" height="600" rx="44" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
    <rect x="15" y="15" width="290" height="570" rx="36" fill="#0f172a"/>
    <rect x="95" y="24" width="130" height="24" rx="12" fill="#1e293b"/>

    <text x="35" y="90" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Consultation Room</text>
    <rect x="30" y="120" width="260" height="260" rx="18" fill="#1e293b"/>
    <circle cx="160" cy="220" r="45" fill="#10b981" opacity="0.8"/>
    <text x="125" y="295" fill="#94a3b8" font-family="sans-serif" font-size="14">Encrypted Stream</text>

    <!-- Controls -->
    <circle cx="85" cy="430" r="24" fill="#334155"/>
    <circle cx="160" cy="430" r="28" fill="#ef4444"/>
    <circle cx="235" cy="430" r="24" fill="#334155"/>
  </g>
</svg>
