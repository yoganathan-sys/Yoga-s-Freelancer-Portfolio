<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#a97142" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bg-grad)" />

  <!-- Abstract Tech Grid Lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="300" y1="0" x2="300" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="500" y1="0" x2="500" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
    <line x1="700" y1="0" x2="700" y2="1000" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
  </g>

  <!-- Glowing Backdrop Circle -->
  <circle cx="400" cy="480" r="320" fill="url(#glow-grad)" filter="url(#shadow)" />

  <!-- Code Symbols Ambient -->
  <text x="140" y="240" fill="#3b82f6" opacity="0.3" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
  <text x="640" y="320" fill="#8b5cf6" opacity="0.3" font-family="monospace" font-size="24" font-weight="bold">{ ... }</text>
  <text x="120" y="680" fill="#10b981" opacity="0.3" font-family="monospace" font-size="22" font-weight="bold">const dev = true;</text>
  <text x="620" y="640" fill="#f59e0b" opacity="0.3" font-family="monospace" font-size="26" font-weight="bold">TS / React</text>

  <!-- Developer Silhouette / Portrait Illustration -->
  <!-- Shoulders & Coat -->
  <path d="M 160 1000 C 180 820 250 720 400 720 C 550 720 620 820 640 1000 Z" fill="url(#suit-grad)" filter="url(#shadow)" />
  
  <!-- Collar / Inner shirt -->
  <path d="M 340 720 L 400 810 L 460 720 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 370 720 L 400 780 L 430 720 Z" fill="#2563eb" />

  <!-- Neck -->
  <path d="M 350 560 L 350 730 C 370 750 430 750 450 730 L 450 560 Z" fill="url(#skin-grad)" />

  <!-- Head Outline -->
  <ellipse cx="400" cy="460" rx="130" ry="170" fill="url(#skin-grad)" filter="url(#shadow)" />

  <!-- Modern Hair Style -->
  <path d="M 270 440 C 265 310 330 250 400 250 C 475 250 535 300 530 430 C 510 400 480 370 400 370 C 330 370 295 410 270 440 Z" fill="#1c1917" />

  <!-- Modern Tech Glasses -->
  <rect x="310" y="440" width="75" height="42" rx="10" fill="none" stroke="#2563eb" stroke-width="7" opacity="0.9" />
  <rect x="415" y="440" width="75" height="42" rx="10" fill="none" stroke="#2563eb" stroke-width="7" opacity="0.9" />
  <line x1="385" y1="460" x2="415" y2="460" stroke="#2563eb" stroke-width="7" />
  <line x1="280" y1="455" x2="310" y2="460" stroke="#2563eb" stroke-width="5" />
  <line x1="490" y1="460" x2="520" y2="455" stroke="#2563eb" stroke-width="5" />

  <!-- Subtle Eyes behind glasses -->
  <circle cx="347" cy="461" r="7" fill="#18181b" />
  <circle cx="453" cy="461" r="7" fill="#18181b" />
  <circle cx="350" cy="459" r="2" fill="#ffffff" />
  <circle cx="456" cy="459" r="2" fill="#ffffff" />

  <!-- Confident Smile -->
  <path d="M 365 550 Q 400 575 435 550" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />

  <!-- Professional Badge Tag -->
  <g transform="translate(250, 890)">
    <rect width="300" height="54" rx="27" fill="#18181b" stroke="#3b82f6" stroke-width="2" />
    <circle cx="30" cy="27" r="8" fill="#10b981" />
    <text x="50" y="33" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1">YOGANATHAN A  •  DEV</text>
  </g>
</svg>
